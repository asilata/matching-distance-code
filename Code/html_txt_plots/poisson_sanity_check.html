<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colored Scatter Plot</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        #chart-container {
            width: 90%;
            max-width: 900px;
            height: 600px;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div id="chart-container">
        <div id="myPlot"></div>
    </div>

    <script>
        // --- Data for Parent Module 0 (Red) ---
        const x0 = [
            3.543500423063035, 2.516479372353089, 1.3647285651485586, 0.35815400372028616,
            -1.0174367270353257, -0.6418184042167243, -2.045566523797337, -2.118690085986595,
            -1.5747512443680276, -2.624807277950724, 0.07818269668906908, 3.378207304333613,
            -2.6517445799380455, -3.813096097278379, 2.017656135518725
        ];
        const y0 = [
            -1.4693027809160153, -2.5511504516970067, -1.177076793596811, -0.5432684619635646,
            -1.2992106217744377, 1.4884576057929655, -0.572541528012839, -2.035035582646729,
            -3.1956236675825753, 3.0626522138280485, 3.6393388988981084, 3.8572820120820692,
            -3.917990105111744, 3.4046642833076746, 3.9808303426141656
        ];

        // --- Data for Parent Module 1 (Blue) ---
        const x1 = [
            3.8590930302964814, 2.4602188650053165, 2.1739398748943337, -0.14128352597367666,
            0.43111600783985526, 1.3966081652270157, 3.539324820744424, 1.7626877346650627,
            -0.947839030767335, -2.549203041256892, 0.3106919473841909, 3.0950963673261036,
            -3.1885896942241656, -3.767308644025187, -3.9221079280520326, -1.3061925457297816,
            0.12043267286097681, -3.6539568463497583, 2.870208557316574
        ];
        const y1 = [
            -0.06215357064891425, -0.5994714586396421, 0.788305480560437, -2.2421377124886637,
            0.7001596660089957, -3.0816298874868595, 1.7578994921315072, 2.4207521049308625,
            -0.08021281992448648, 0.8558369785924329, -3.91490651185234, -3.90458803983248,
            -0.9839508668458237, 0.10544391943398335, 1.891092867075904, 2.606197138547701,
            2.356142901027451, -2.98266590249165, 2.798792629000257
        ];

        // Define Trace for Module 0 (Red)
        const trace0 = {
            x: x0,
            y: y0,
            mode: 'markers',
            type: 'scatter',
            name: 'Parent 0',
            marker: { size: 12, color: 'red' }
        };

        // Define Trace for Module 1 (Blue)
        const trace1 = {
            x: x1,
            y: y1,
            mode: 'markers',
            type: 'scatter',
            name: 'Parent 1',
            marker: { size: 12, color: 'blue' }
        };

        // Define Layout
        const layout = {
            title: 'Scatter Plot by Parent Module',
            xaxis: { title: 'X Coordinates', zeroline: true },
            yaxis: { title: 'Y Coordinates', zeroline: true, scaleanchor: "x", scaleratio: 1 },
            hovermode: 'closest'
        };

        // Render Plot with both traces
        Plotly.newPlot('myPlot', [trace0, trace1], layout);
    </script>

</body>

</html>
