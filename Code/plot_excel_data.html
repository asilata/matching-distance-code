<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Res Graph Tool v10 (Fixed Fonts)</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            background: #f0f2f5;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            color: #202124;
            font-size: 1.5rem;
        }

        h3 {
            margin: 15px 0 10px 0;
            font-size: 0.9rem;
            color: #5f6368;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        /* Controls */
        .sidebar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            height: fit-content;
            max-height: 90vh;
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #444;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            resize: vertical;
        }

        button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #1557b0;
        }

        /* Toggles */
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            background: #e8f0fe;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #d2e3fc;
        }

        .toggle-row input {
            width: auto;
            cursor: pointer;
        }

        .toggle-row label {
            margin: 0;
            cursor: pointer;
            color: #1967d2;
            font-weight: 600;
        }

        /* Colors */
        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            background: white;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .color-row label {
            margin: 0;
            font-size: 0.9em;
            font-weight: normal;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .color-row input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        #myDiv {
            width: 100%;
            height: 700px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-top: 10px;
            background: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="grid-layout">

            <div class="sidebar">
                <h2>Configuration</h2>

                <div class="control-group">
                    <label>Paste Data</label>
                    <textarea id="dataInput" placeholder="Paste headers and data..."></textarea>
                    <button onclick="drawGraph()">Update Graph</button>
                </div>

                <div class="toggle-row">
                    <input type="checkbox" id="smartLayering" checked onchange="drawGraph()">
                    <label for="smartLayering" title="Sorts layers by absolute magnitude">Smart Layering (|Abs|)</label>
                </div>

                <div id="seriesColorContainer">
                    <h3>Series Colors</h3>
                    <div id="colorList"></div>
                </div>

                <h3>Appearance</h3>
                <div class="control-group">
                    <label>Opacity: <span id="opVal">1.0</span></label>
                    <input type="range" id="opacitySlider" min="0.1" max="1.0" step="0.1" value="1.0"
                        oninput="updateLabel('opVal', this.value)">
                </div>

                <div class="control-group">
                    <label>Base Font Size: <span id="fontVal">20</span>px</label>
                    <input type="range" id="fontSizeSlider" min="10" max="30" step="1" value="20"
                        oninput="updateLabel('fontVal', this.value)">
                </div>

                <div class="control-group">
                    <label>Line Thickness</label>
                    <select id="lineWidth" onchange="drawGraph()">
                        <option value="0">None</option>
                        <option value="2" selected>Medium</option>
                        <option value="4">Thick</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Font Family</label>
                    <select id="fontFamily" onchange="drawGraph()">
                        <option value="'Times New Roman', serif">Times New Roman</option>
                        <option value="Arial, sans-serif">Arial</option>
                        <option value="'Roboto', sans-serif">Roboto</option>
                    </select>
                </div>
            </div>

            <div>
                <div style="margin-bottom: 10px;">
                    <input type="text" id="chartTitle" value="Total number of rectangles vs log(computation time)"
                        placeholder="Main Chart Title"
                        style="font-weight: bold; font-size: 1.3em; margin-bottom: 10px; padding: 10px;">

                    <div style="display: flex; gap: 15px;">
                        <input type="text" id="xAxisLabel" value="Total number of rectangles" placeholder="Total number of rectangles"
                            style="flex: 1;">
                        <input type="text" id="yAxisLabel" value="log(computation time)" placeholder="Y-Axis Label"
                            style="flex: 1;">
                    </div>
                </div>

                <div id="myDiv"></div>
                <p style="font-size: 0.85em; color: #666; margin-top: 5px;">* Click the camera icon to download high-res
                    PNG (300 DPI equivalent).</p>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_PALETTE = ['#F4B400', '#DB4437', '#4285F4', '#0F9D58', '#AB47BC'];
        let colorMap = {};

        function updateLabel(id, val) {
            document.getElementById(id).innerText = val;
            drawGraph();
        }

        function getColor(header, index) {
            if (!colorMap[header]) {
                colorMap[header] = DEFAULT_PALETTE[index % DEFAULT_PALETTE.length];
            }
            return colorMap[header];
        }

        function refreshColorPickers(headers) {
            const list = document.getElementById('colorList');
            list.innerHTML = '';
            headers.forEach((h, i) => {
                const row = document.createElement('div');
                row.className = 'color-row';

                const lbl = document.createElement('label');
                lbl.innerText = h;

                const inp = document.createElement('input');
                inp.type = 'color';
                inp.value = getColor(h, i);
                inp.oninput = (e) => {
                    colorMap[h] = e.target.value;
                    drawGraph();
                };

                row.appendChild(lbl);
                row.appendChild(inp);
                list.appendChild(row);
            });
        }

        function drawGraph() {
            const rawInput = document.getElementById('dataInput').value.trim();
            if (!rawInput) return;

            // 1. Parse Data
            const rows = rawInput.split('\n').map(r => r.split(/\t/));
            const headers = rows[0].map(h => h.trim());
            let dataRows = rows.slice(1).filter(r => r.length > 1 && r[0].trim() !== '');

            // Sort by X
            dataRows.sort((a, b) => parseFloat(a[0]) - parseFloat(b[0]));

            const xValues = dataRows.map(r => parseFloat(r[0]));
            const ySeries = [];
            const seriesNames = [];

            for (let i = 1; i < headers.length; i++) {
                seriesNames.push(headers[i]);
                ySeries.push(dataRows.map(r => parseFloat(r[i])));
            }

            refreshColorPickers(seriesNames);

            // Inputs
            const useSmartLayering = document.getElementById('smartLayering').checked;
            const opacity = parseFloat(document.getElementById('opacitySlider').value);
            const lineWidth = parseInt(document.getElementById('lineWidth').value);
            const userFont = document.getElementById('fontFamily').value;
            const baseFontSize = parseInt(document.getElementById('fontSizeSlider').value);
            const userTitle = document.getElementById('chartTitle').value;
            const userXLabel = document.getElementById('xAxisLabel').value;
            const userYLabel = document.getElementById('yAxisLabel').value;
            const finalXLabel = userXLabel.trim() !== "" ? userXLabel : headers[0];

            let finalTraces = [];
            const legendTracker = new Set();

            if (!useSmartLayering) {
                seriesNames.forEach((name, i) => {
                    const color = colorMap[name];
                    const rgba = `rgba(${parseInt(color.slice(1, 3), 16)}, ${parseInt(color.slice(3, 5), 16)}, ${parseInt(color.slice(5, 7), 16)}, ${opacity})`;

                    finalTraces.push({
                        name: name,
                        x: xValues.map((_, idx) => idx),
                        y: ySeries[i],
                        type: 'scatter',
                        mode: lineWidth > 0 ? 'lines' : 'none',
                        fill: 'tozeroy',
                        line: { color: color, width: lineWidth },
                        fillcolor: rgba
                    });
                });
            } else {
                // --- ABSOLUTE SMART MODE ---
                const numPoints = xValues.length;
                const numSeries = seriesNames.length;

                let currentSegment = { startIndex: 0, ranks: [] };

                const getRank = (idx) => {
                    let seriesIndices = Array.from({ length: numSeries }, (_, k) => k);
                    seriesIndices.sort((a, b) => {
                        const valA = Math.abs(ySeries[a][idx]);
                        const valB = Math.abs(ySeries[b][idx]);
                        return valB - valA;
                    });
                    return seriesIndices;
                };

                currentSegment.ranks = getRank(0);
                let allSegments = [];

                for (let i = 1; i < numPoints; i++) {
                    const newRank = getRank(i);
                    if (JSON.stringify(newRank) !== JSON.stringify(currentSegment.ranks)) {
                        allSegments.push({
                            start: currentSegment.startIndex,
                            end: i,
                            ranks: currentSegment.ranks
                        });
                        currentSegment = { startIndex: i, ranks: newRank };
                    }
                }
                allSegments.push({
                    start: currentSegment.startIndex,
                    end: numPoints - 1,
                    ranks: currentSegment.ranks
                });

                for (let layer = 0; layer < numSeries; layer++) {
                    seriesNames.forEach((name, sIdx) => {
                        let traceX = [];
                        let traceY = [];

                        allSegments.forEach(seg => {
                            const activeSeriesIdx = seg.ranks[layer];
                            if (activeSeriesIdx === sIdx) {
                                for (let k = seg.start; k <= seg.end; k++) {
                                    traceX.push(k);
                                    traceY.push(ySeries[sIdx][k]);
                                }
                                traceX.push(null);
                                traceY.push(null);
                            }
                        });

                        if (traceX.length > 0) {
                            const color = colorMap[name];
                            const rgba = `rgba(${parseInt(color.slice(1, 3), 16)}, ${parseInt(color.slice(3, 5), 16)}, ${parseInt(color.slice(5, 7), 16)}, ${opacity})`;

                            let showInLegend = false;
                            if (!legendTracker.has(name)) {
                                showInLegend = true;
                                legendTracker.add(name);
                            }

                            finalTraces.push({
                                name: name,
                                x: traceX,
                                y: traceY,
                                type: 'scatter',
                                mode: lineWidth > 0 ? 'lines' : 'none',
                                fill: 'tozeroy',
                                line: { color: color, width: lineWidth },
                                fillcolor: rgba,
                                showlegend: showInLegend,
                                legendgroup: name,
                                hoverinfo: 'y+name'
                            });
                        }
                    });
                }
            }

            // Ticks Logic
            const tickVals = [];
            const tickText = [];
            let currentGroup = null;
            let startIndex = 0;

            xValues.forEach((val, index) => {
                if (val !== currentGroup) {
                    if (currentGroup !== null) {
                        tickVals.push(startIndex + (index - startIndex) / 2);
                        tickText.push(currentGroup);
                    }
                    currentGroup = val;
                    startIndex = index;
                }
            });
            if (currentGroup !== null) {
                tickVals.push(startIndex + (xValues.length - startIndex) / 2);
                tickText.push(currentGroup);
            }

            const layout = {
                title: { text: userTitle, font: { size: baseFontSize * 1.5 } },
                font: { family: userFont, size: baseFontSize },
                xaxis: {
                    tickmode: 'array',
                    tickvals: tickVals,
                    ticktext: tickText,
                    title: { text: finalXLabel, font: { size: baseFontSize, weight: 'bold' } },
                    showgrid: false
                },
                yaxis: {
                    title: { text: userYLabel, font: { size: baseFontSize } },
                    gridcolor: '#eee',
                    zeroline: false
                },
                legend: {
                    orientation: 'h',
                    y: 1.05,
                    x: 0,
                    font: { size: baseFontSize }
                },
                margin: { l: 60, r: 30, t: 80, b: 60 },
                hovermode: 'x unified'
            };

            // --- HIGH RES FIX ---
            // We removed width/height to let it respect screen aspect ratio
            // We rely on scale: 3 for resolution
            const config = {
                toImageButtonOptions: {
                    format: 'png',
                    filename: 'high_res_graph',
                    scale: 3 // High DPI
                }
            };

            Plotly.newPlot('myDiv', finalTraces, layout, config);
        }
    </script>

</body>

</html>
